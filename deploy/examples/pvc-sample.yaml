apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: demo-app-data
  namespace: default
  annotations:
    subvol.io/owner: "1000:1000"
    subvol.io/mode: "0750"
    # Optional override for subvolume name
    # subvol.io/subvol: "custom/path"
    # Optional snapshot before delete
    # subvol.io/snapshot-before-delete: "true"
    # Optional live quota override (reconciled grow and shrink; "none" to remove)
    # subvol.io/quota: "50Gi"
    # Optional live ZFS property overrides (StorageClass properties are the base)
    # subvol.io/properties: |
    #   compression=lz4
    #   atime=off
    # Preview planned changes without applying them
    # subvol.io/dry-run: "true"
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: zfs-fast
  resources:
    requests:
      storage: 20Gi
